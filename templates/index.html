<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes ADSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-hover tbody tr:hover { background-color: #f1f5f9; transition: 0.3s; }
    </style>
</head>
<body class="py-5">

<div class="container">
    <h2 class="text-center mb-4 fw-bold text-primary">
        <i class="bi bi-mortarboard-fill me-2"></i>Gestión de Estudiantes
    </h2>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 p-4">
                <h5 class="mb-3 text-secondary"><i class="bi bi-person-plus-fill me-2"></i>Nuevo Registro</h5>
                <form id="formEstudiante">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Documento</label>
                        <input type="number" class="form-control bg-light" id="documento" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Nombre Completo</label>
                        <input type="text" class="form-control bg-light" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control bg-light" id="correo_electronico" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Programa de Formación</label>
                        <select class="form-select bg-light" id="programa_formacion" required>
                            <option value="">Seleccione...</option>
                            <option value="Análisis y Desarrollo de Software (ADSO)">ADSO</option>
                            <option value="Gestión de Redes">Gestión de Redes</option>
                            <option value="Multimedia">Multimedia</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Ficha</label>
                        <input type="text" class="form-control bg-light" id="ficha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-save2 me-2"></i>Registrar Estudiante
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 p-4 h-100">
                <h5 class="mb-3 text-secondary"><i class="bi bi-list-task me-2"></i>Estudiantes Registrados</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light text-secondary">
                            <tr>
                                <th>Doc.</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Programa</th>
                                <th>Ficha</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEstudiantes">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('formEstudiante');
    const alerta = document.getElementById('alerta');

    // Función para mostrar mensajes en pantalla
    const mostrarAlerta = (mensaje, tipo) => {
        alerta.className = `alert alert-${tipo} alert-dismissible fade show`;
        alerta.innerHTML = `${mensaje} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
    };

    // 1. CARGAR ESTUDIANTES (Petición GET)
    const cargarEstudiantes = async () => {
        try {
            const respuesta = await fetch('/estudiantes');
            const data = await respuesta.json();
            
            const tbody = document.getElementById('tablaEstudiantes');
            tbody.innerHTML = ''; // Limpiamos la tabla

            data.forEach(est => {
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${est.documento}</td>
                        <td>${est.nombre}</td>
                        <td>${est.correo_electronico}</td>
                        <td><span class="badge bg-info text-dark">${est.programa_formacion}</span></td>
                        <td><span class="badge bg-secondary">${est.ficha}</span></td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Error al cargar:", error);
        }
    };

    // 2. REGISTRAR ESTUDIANTE (Petición POST)
    form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Evitamos que la página se recargue

        // Recolectamos los datos de los inputs
        const nuevoEstudiante = {
            documento: document.getElementById('documento').value,
            nombre: document.getElementById('nombre').value,
            correo_electronico: document.getElementById('correo_electronico').value,
            programa_formacion: document.getElementById('programa_formacion').value,
            ficha: document.getElementById('ficha').value
        };

        try {
            // Enviamos el JSON a tu endpoint de Flask
            const respuesta = await fetch('/estudiantes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoEstudiante)
            });

            const data = await respuesta.json();

            if (respuesta.ok) {
                mostrarAlerta("¡Estudiante registrado con éxito!", "success");
                form.reset(); // Limpia el formulario
                cargarEstudiantes(); // Recarga la tabla para mostrar al nuevo
            } else {
                // Si la BD falla (ej. documento duplicado), mostramos el error del Except
                mostrarAlerta(`<strong>Error:</strong> ${data.error} <br><small>${data.detalle || ''}</small>`, "danger");
            }
        } catch (error) {
            mostrarAlerta("Error de conexión con el servidor", "danger");
        }
    });

    // Cargamos la tabla automáticamente al abrir la página
    window.onload = cargarEstudiantes;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
